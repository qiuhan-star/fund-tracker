<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>交易左滑 / 全屏编辑 演示</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    background: #f2f3f5; color: #1d1d1f; max-width: 460px; margin: 0 auto;
  }
  .bar { padding: 14px 16px; font-size: 17px; font-weight: 600; background: #fff; border-bottom: 1px solid #e5e5ea; }
  .hint { padding: 10px 16px; font-size: 12px; color: #8a8a8e; background: #fffbe6; }

  /* ---- 交易卡片（左滑揭示） ---- */
  .tx-card { position: relative; overflow: hidden; touch-action: pan-y pinch-zoom; background: #fff; border-bottom: 1px solid #eee; }
  .tx-card-inner { position: relative; z-index: 1; background: #fff; transition: transform .25s ease; will-change: transform; padding: 14px 16px; }
  .tx-row { display: flex; justify-content: space-between; align-items: center; }
  .tx-name { font-size: 15px; font-weight: 600; }
  .tx-sub { font-size: 12px; color: #8a8a8e; margin-top: 3px; }
  .tx-amt { font-size: 15px; font-weight: 600; }
  .tx-amt.buy { color: #e54d42; }
  .tx-amt.sell { color: #1aad19; }
  .tx-swipe-actions { position: absolute; right: 0; top: 0; bottom: 0; display: flex; z-index: 0; }
  .tx-sa-btn { border: none; color: #fff; font-size: 14px; font-weight: 600; padding: 0 18px; cursor: pointer; }
  .tx-edit { background: #1989fa; }
  .tx-del { background: #e54d42; }

  /* ---- 全屏编辑页 ---- */
  .edit-page { position: fixed; inset: 0; background: #f2f3f5; z-index: 50; display: none; flex-direction: column; }
  .edit-page.open { display: flex; }
  .ep-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #fff; border-bottom: 1px solid #e5e5ea; }
  .ep-back { width: 30px; height: 30px; border: none; background: transparent; font-size: 24px; cursor: pointer; color: #1989fa; }
  .ep-title { font-size: 17px; font-weight: 600; }
  .ep-body { flex: 1; overflow: auto; padding: 16px; }
  .seg { display: flex; background: #ececec; border-radius: 10px; padding: 3px; margin-bottom: 16px; }
  .seg button { flex: 1; border: none; background: transparent; padding: 9px 0; border-radius: 8px; font-size: 14px; font-weight: 600; color: #555; cursor: pointer; }
  .seg button.on { background: #fff; color: #1d1d1f; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .field { background: #fff; border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: #8a8a8e; margin-bottom: 6px; }
  .field .val { font-size: 17px; font-weight: 600; }
  .field input { width: 100%; border: none; font-size: 17px; font-weight: 600; outline: none; }
  .ep-foot { display: flex; gap: 12px; padding: 12px 16px; background: #fff; border-top: 1px solid #e5e5ea; }
  .ep-foot button { flex: 1; border: none; border-radius: 12px; padding: 13px 0; font-size: 16px; font-weight: 600; cursor: pointer; }
  .ep-del { background: #fdeceb; color: #e54d42; }
  .ep-save { background: #1989fa; color: #fff; }
</style>
</head>
<body>
  <div class="bar">交易记录</div>
  <div class="hint">手机：向左滑动卡片 → 出现「编辑 / 删除」；点「编辑」进入全屏页。<br>电脑：直接点卡片即可模拟左滑。</div>
  <div id="list"></div>

  <!-- 全屏编辑页 -->
  <div class="edit-page" id="editPage">
    <div class="ep-head">
      <button class="ep-back" onclick="closeEdit()">‹</button>
      <div class="ep-title">编辑交易</div>
    </div>
    <div class="ep-body">
      <div class="seg">
        <button class="on">买入</button><button>卖出</button><button>转换</button>
      </div>
      <div class="field">
        <label>金额</label>
        <input value="¥ 5,000.00">
      </div>
      <div class="field"><label>账户</label><div class="val">招商银行 (****1234)</div></div>
      <div class="field"><label>交易时间</label><div class="val">2026-08-10 14:32</div></div>
      <div class="field">
        <label>备注</label>
        <input placeholder="添加备注…">
      </div>
    </div>
    <div class="ep-foot">
      <button class="ep-del" onclick="closeEdit()">删除这笔</button>
      <button class="ep-save" onclick="closeEdit()">保存</button>
    </div>
  </div>

<script>
  var trades = [
    { name: "易方达蓝筹精选", sub: "2026-08-10 · 买入", amt: "-¥5,000.00", type: "buy" },
    { name: "中欧医疗健康", sub: "2026-08-08 · 卖出", amt: "+¥3,200.00", type: "sell" },
    { name: "华夏成长混合", sub: "2026-08-05 · 转换", amt: "-¥1,500.00", type: "buy" },
    { name: "广发稳健增长", sub: "2026-08-01 · 买入", amt: "-¥8,000.00", type: "buy" }
  ];

  var TH = 40;            // 触发阈值(px)
  var OPEN = -130;        // 打开位移(px)
  var openedCard = null;
  var list = document.getElementById('list');

  trades.forEach(function (t, i) {
    var card = document.createElement('div');
    card.className = 'tx-card';
    card.innerHTML =
      '<div class="tx-swipe-actions">' +
        '<button class="tx-sa-btn tx-edit">编辑</button>' +
        '<button class="tx-sa-btn tx-del">删除</button>' +
      '</div>' +
      '<div class="tx-card-inner">' +
        '<div class="tx-row">' +
          '<div><div class="tx-name">' + t.name + '</div><div class="tx-sub">' + t.sub + '</div></div>' +
          '<div class="tx-amt ' + t.type + '">' + t.amt + '</div>' +
        '</div>' +
      '</div>';
    list.appendChild(card);

    var inner = card.querySelector('.tx-card-inner');
    var startX = 0, dx = 0, active = false;

    card.addEventListener('touchstart', function (e) {
      if (e.target.closest('.tx-swipe-actions')) return;
      startX = e.touches[0].clientX; dx = 0; active = true;
      inner.style.transition = 'none';
    }, { passive: true });

    card.addEventListener('touchmove', function (e) {
      if (!active) return;
      dx = e.touches[0].clientX - startX;
      var base = (card === openedCard) ? OPEN : 0;
      var next = Math.max(OPEN - 80, Math.min(0, base + dx));
      inner.style.transform = 'translateX(' + next + 'px)';
    }, { passive: true });

    card.addEventListener('touchend', function (e) {
      if (e.target.closest('.tx-swipe-actions')) return;
      if (!active) return; active = false;
      inner.style.transition = 'transform .25s ease';
      if (dx < -TH) { inner.style.transform = 'translateX(' + OPEN + 'px)'; openedCard = card; }
      else { inner.style.transform = 'translateX(0)'; if (card === openedCard) openedCard = null; }
    }, { passive: true });

    // 电脑：点卡片模拟左滑
    card.querySelector('.tx-card-inner').addEventListener('click', function () {
      if (card === openedCard) { inner.style.transform = 'translateX(0)'; openedCard = null; }
      else {
        if (openedCard) openedCard.querySelector('.tx-card-inner').style.transform = 'translateX(0)';
        inner.style.transform = 'translateX(' + OPEN + 'px)'; openedCard = card;
      }
    });

    card.querySelector('.tx-edit').addEventListener('click', function (e) {
      e.stopPropagation(); openEdit();
    });
    card.querySelector('.tx-del').addEventListener('click', function (e) {
      e.stopPropagation(); card.style.display = 'none'; openedCard = null;
    });
  });

  function openEdit() { document.getElementById('editPage').classList.add('open'); }
  function closeEdit() { document.getElementById('editPage').classList.remove('open'); }
</script>
</body>
</html>
